<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROFI STAND UP — программа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#0021c3; --blue2:#0025d8; --red:#de1919; --cream:#fbfaf6;
  --ink:#101014; --gray:#8a8a8a; --line:rgba(16,16,20,.1);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 90px;}
.mapshot{width:100%;overflow:auto;border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:pinch-zoom;}
.mapshot svg{width:100%;height:auto;display:block;min-width:280px;max-width:520px;margin:0 auto;}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:14px;}
.legend div{font-size:12.5px;font-weight:600;display:flex;gap:6px;}
.legend b{color:var(--blue);flex:none;}
header{background:var(--blue);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 22px;}
.logohead{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo{line-height:.9;}
.logo .l1{display:block;font-weight:500;font-size:15px;letter-spacing:2px;opacity:.85;}
.logo .l2{display:inline-block;font-weight:900;font-size:26px;letter-spacing:.5px;background:var(--red);padding:3px 10px 4px;border-radius:5px;transform:rotate(-2deg);margin-top:4px;}
.logo .l2 .dot{color:#fff;}
.emoji{width:56px;height:56px;object-fit:contain;flex:none;filter:brightness(0) invert(1);opacity:.95;}
.sub{margin-top:10px;font-weight:600;font-size:13px;opacity:.85;}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:2px solid var(--line);padding:8px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;}
.tabbar button{flex:1;border:none;background:transparent;color:var(--gray);font-family:inherit;font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;}
.tabbar button .ic{font-size:20px;}
.tabbar button.active{color:var(--red);}
.view{display:none;}
.view.active{display:block;}
.item{border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;position:relative;}
.item.now{border-color:var(--red);background:#fff5f5;}
.item.past{opacity:.45;}
.item.break{background:transparent;border-style:dashed;box-shadow:none;}
.time{font-weight:800;font-size:13px;color:var(--blue);}
.item.now .time{color:var(--red);}
.title{font-weight:700;font-size:15px;margin-top:3px;line-height:1.25;}
.speaker{font-size:12.5px;color:var(--gray);margin-top:3px;font-weight:600;}
.tag{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-top:6px;}
.tag.now{background:var(--red);color:#fff;}
.tag.past{background:var(--line);color:var(--gray);}
h2.section{font-size:13px;text-transform:uppercase;font-weight:800;color:var(--blue);letter-spacing:.5px;margin:22px 0 10px;}
label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;color:var(--ink);}
input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;}
input:focus{outline:none;border-color:var(--blue);}
.btn{display:block;width:100%;margin-top:18px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:14px;font-family:inherit;font-weight:800;font-size:14px;text-transform:uppercase;cursor:pointer;}
.btn.alt{background:var(--blue);}
.card-box{background:#fff;border:2px solid var(--blue);border-radius:14px;padding:22px;text-align:center;margin-top:14px;}
.card-box .name{font-weight:800;font-size:19px;margin-bottom:4px;}
.card-box .role{font-size:12px;color:var(--gray);font-weight:600;margin-bottom:14px;}
#qrbox{display:flex;justify-content:center;margin:14px 0;}
.chip{display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid var(--line);border-radius:9px;margin-top:8px;text-decoration:none;color:var(--ink);font-weight:700;font-size:13.5px;}
.chip b{color:var(--blue);min-width:74px;text-align:left;}
.linkrow{display:flex;gap:8px;margin-top:14px;}
.linkrow input{flex:1;font-size:12px;color:var(--gray);}
.copybtn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:0 16px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;}
.hint{font-size:11.5px;color:var(--gray);margin-top:10px;line-height:1.4;}
</style>
</head>

<div class="tabbar">
  <button id="tabProg" class="active"><span class="ic">📅</span>Программа</button>
  <button id="tabCard"><span class="ic">🪪</span>Визитка</button>
  <button id="tabMap"><span class="ic">🗺️</span>Карта</button>
</div>

<script>
// ---------- данные программы ----------
// время события: 3 октября 2026, Ташкент = UTC+5
function ts(h,m){ return Date.UTC(2026,9,3,h-5,m); }
const items = [
["10:00","11:00","Welcome-кофе и нетворкинг","",1],
["11:00","11:10","Открытие стендапа","Ведущий",0],
["11:10","11:25","Где мой бухгалтер? Как найти и сохранить","Арсений Кучерюк",0],
["11:30","11:45","Цена вежливости или как не уронить самолёт","Виолетта Аксу",0],
["11:40","11:55","Финансист: тормоз или навигатор","Жанна Искенова",0],
["12:00","12:15","Бухгалтерия без фильтров","Олеся Фахритдинова & Шахзод Ибрагимов",0],
["12:20","12:35","«Выживший», или один день из жизни бухгалтера","Лола Каримова",0],
["12:40","12:55","Вручение наград лидерам","Ведущий",0],
["12:55","13:00","Приглашение на обед","Ведущий",0],
["13:00","14:00","Обед","",1],
["14:00","14:15","Викторина от Leading Group","Сарвар",0],
["14:20","14:35","ИИ: вместо или вместе?","Шавкат Каримов",0],
["14:40","14:55","Директор vs Бухгалтер: от триллера к хокку","Татьяна Шалунова",0],
["15:00","15:15","МСФО: путь самурая","Камила Бигожина",0],
["15:20","15:35","Парадокс","Ирода Аббосхонова",0],
["15:40","15:55","Вручение наград лидерам","Ведущий",0],
["15:55","16:00","Приглашение на кофе-брейк","Ведущий",0],
["16:00","16:40","Кофе-брейк","",1],
["16:40","16:55","Викторина от TBC Bank","",0],
["17:00","17:15","«Не подходи — убьёт», или инструкция по работе с бухгалтером","Андрей Гадубяк",0],
["17:15","17:30","Страхи: инвентаризация и баланс","Елена Щербак",0],
["17:30","17:45","Вручение наград лидерам","Ведущий",0],
["17:45","18:00","Лотерея с подарками от спонсоров","",1],
["18:00","18:15","Благодарности спонсорам","Ведущий",0],
].map(([s,e,title,speaker,isBreak])=>{
  const [sh,sm]=s.split(':').map(Number), [eh,em]=e.split(':').map(Number);
  return {s,e,title,speaker,isBreak,start:ts(sh,sm),end:ts(eh,em)};
});

function renderProgram(){
  const now = Date.now();
  const html = items.map(it=>{
    let cls='item', tag='';
    if(it.isBreak) cls+=' break';
    if(now>=it.start && now<it.end){ cls+=' now'; tag='<span class="tag now">Сейчас</span>'; }
    else if(now>=it.end){ cls+=' past'; tag='<span class="tag past">Пройдено</span>'; }
    return `<div class="${cls}">
      <div class="time">${it.s}–${it.e}</div>
      <div class="title">${it.title}</div>
      ${it.speaker?`<div class="speaker">${it.speaker}</div>`:''}
      ${tag}
    </div>`;
  }).join('');
  document.getElementById('progList').innerHTML = html;
}
renderProgram();
setInterval(renderProgram, 30000);

// ---------- визитка ----------
const viewCard = document.getElementById('viewCard');
const params = new URLSearchParams(location.search);

function chip(label, val, hrefFn){
  if(!val) return '';
  return `<a class="chip" href="${hrefFn(val)}" target="_blank" rel="noopener"><b>${label}</b>${val}</a>`;
}

function renderPublicCard(){
  const n=params.get('n')||'', tg=params.get('tg')||'', ig=params.get('ig')||'', wa=params.get('wa')||'', ph=params.get('ph')||'';
  viewCard.innerHTML = `
    <div class="card-box">
      <div class="name">${n||'Участник PROFI STAND UP'}</div>
      <div class="role">Визитка участника мероприятия</div>
      ${chip('Telegram', tg, v=>'https://t.me/'+v.replace('@',''))}
      ${chip('Instagram', ig, v=>'https://instagram.com/'+v.replace('@',''))}
      ${chip('WhatsApp', wa, v=>'https://wa.me/'+v.replace(/\D/g,''))}
      ${chip('Телефон', ph, v=>'tel:'+v.replace(/\s/g,''))}
    </div>`;
}

function loadSaved(){
  try{ return JSON.parse(localStorage.getItem('psu_card')||'null'); }catch(e){ return null; }
}
function saveLocal(data){
  try{ localStorage.setItem('psu_card', JSON.stringify(data)); }catch(e){}
}

function buildUrl(data){
  const p = new URLSearchParams();
  if(data.n) p.set('n',data.n);
  if(data.tg) p.set('tg',data.tg);
  if(data.ig) p.set('ig',data.ig);
  if(data.wa) p.set('wa',data.wa);
  if(data.ph) p.set('ph',data.ph);
  const base = location.origin + location.pathname;
  return base + '?' + p.toString();
}

function renderResult(data){
  const url = buildUrl(data);
  viewCard.innerHTML = `
    <h2 class="section">Ваша визитка готова</h2>
    <div class="card-box">
      <div class="name">${data.n||'Без имени'}</div>
      <div class="role">Покажите этот QR, чтобы поделиться контактами</div>
      <div id="qrbox"></div>
      <div class="linkrow">
        <input readonly value="${url}">
        <button class="copybtn" id="copyBtn">Копир.</button>
      </div>
    </div>
    <button class="btn alt" id="editBtn">Изменить данные</button>
    <div class="hint">Ссылку и QR видят только те, кому вы их покажете лично — карточка не публикуется в общем доступе.</div>
  `;
  new QRCode(document.getElementById('qrbox'), {text:url, width:180, height:180, colorDark:'#0021c3', colorLight:'#ffffff'});
  document.getElementById('copyBtn').onclick = ()=>{
    navigator.clipboard?.writeText(url).catch(()=>{});
    const b=document.getElementById('copyBtn'); b.textContent='Готово'; setTimeout(()=>b.textContent='Копир.',1200);
  };
  document.getElementById('editBtn').onclick = renderForm;
}

function renderForm(){
  const saved = loadSaved() || {};
  viewCard.innerHTML = `
    <h2 class="section">Моя визитка</h2>
    <label>Имя</label><input id="f_n" value="${saved.n||''}" placeholder="Как вас зовут">
    <label>Telegram</label><input id="f_tg" value="${saved.tg||''}" placeholder="@username">
    <label>Instagram</label><input id="f_ig" value="${saved.ig||''}" placeholder="@username">
    <label>WhatsApp</label><input id="f_wa" value="${saved.wa||''}" placeholder="+998...">
    <label>Телефон</label><input id="f_ph" value="${saved.ph||''}" placeholder="+998...">
    <button class="btn" id="genBtn">Создать визитку и QR</button>
    <div class="hint">Заполните хотя бы один контакт. Данные сохранятся на этом телефоне — при следующем визите форма подставится сама.</div>
  `;
  document.getElementById('genBtn').onclick = ()=>{
    const data = {
      n:document.getElementById('f_n').value.trim(),
      tg:document.getElementById('f_tg').value.trim(),
      ig:document.getElementById('f_ig').value.trim(),
      wa:document.getElementById('f_wa').value.trim(),
      ph:document.getElementById('f_ph').value.trim(),
    };
    saveLocal(data);
    renderResult(data);
  };
}

// какой вид карточки показывать
if(params.get('n')||params.get('tg')||params.get('ig')||params.get('wa')||params.get('ph')){
  renderPublicCard();
} else {
  renderForm();
}

// ---------- табы ----------
const tabs = {
  tabProg: {btn:document.getElementById('tabProg'), view:document.getElementById('viewProg')},
  tabCard: {btn:document.getElementById('tabCard'), view:viewCard},
  tabMap:  {btn:document.getElementById('tabMap'),  view:document.getElementById('viewMap')},
};
function showTab(key){
  Object.entries(tabs).forEach(([k,t])=>{
    t.btn.classList.toggle('active', k===key);
    t.view.classList.toggle('active', k===key);
  });
}
Object.keys(tabs).forEach(k=>tabs[k].btn.onclick=()=>showTab(k));
// если открыли по чужой QR-ссылке — сразу показываем визитку
if(params.get('n')||params.get('tg')||params.get('ig')||params.get('wa')||params.get('ph')){ showTab('tabCard'); }
</script>
</body>
